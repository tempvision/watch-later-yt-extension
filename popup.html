<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Watch Later Highlighter settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="wlh-header">
    <div class="wlh-brand">
      <img src="icons/icon48.png" alt="" width="24" height="24" />
      <h1>Watch Later Highlighter</h1>
    </div>
  </header>

  <main class="wlh-cards">
    <section class="wlh-card">
      <div class="wlh-card-text">
        <h2>Accent color</h2>
        <p>Change the highlight color for Watch later in your sidebar.</p>
      </div>
      <div class="wlh-control">
        <input type="color" id="borderColor" />
        <span id="borderColorValue" class="wlh-hex">#ff9800</span>
      </div>
    </section>

    <section class="wlh-card">
      <div class="wlh-card-text">
        <h2>Visible playlists</h2>
        <p>Set how many playlists are visible in your sidebar.</p>
      </div>
      <div class="wlh-control">
        <input type="number" id="maxPlaylists" min="0" max="20" step="1" />
      </div>
    </section>
  </main>

  <footer class="wlh-foot">
    <button id="resetBtn" type="button" title="Reset to defaults">Reset</button>
    <span id="savedNote" class="wlh-saved-note" aria-live="polite"></span>
  </footer>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
