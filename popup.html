<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Watch Later Highlighter settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="wlh-header">
    <div class="wlh-brand">
      <img src="icons/icon48.png" alt="" width="24" height="24" />
      <h1>Watch Later Highlighter</h1>
    </div>
  </header>

  <main class="wlh-cards">
    <section class="wlh-card">
      <div class="wlh-card-text">
        <h2>Accent color</h2>
        <p>Change the highlight color for Watch later in your sidebar.</p>
      </div>
      <div class="wlh-control">
        <input type="color" id="borderColor" aria-label="Watch later accent color" />
        <span id="borderColorValue" class="wlh-hex">#ff9800</span>
      </div>
    </section>

    <section class="wlh-card wlh-card--stack">
      <div class="wlh-playlist-heading">
        <div class="wlh-card-text">
          <h2>Playlist shortcuts</h2>
          <p>Choose which playlists appear in your sidebar.</p>
        </div>
        <button id="refreshPlaylistsBtn" type="button" title="Refresh playlists" aria-label="Refresh playlists">↻</button>
      </div>
      <div class="wlh-playlist-picker">
        <!-- <input type="search" id="playlistSearch" placeholder="Search playlists" aria-label="Search playlists" /> -->
        <div class="wlh-playlist-actions">
          <span id="playlistSelectionCount" class="wlh-playlist-count">0 selected</span>
          <button id="selectAllPlaylistsBtn" type="button">Select all</button>
          <button id="clearPlaylistsBtn" type="button">Clear</button>
        </div>
        <div id="playlistList" class="wlh-playlist-list" aria-live="polite">
          <span class="wlh-playlist-status">Open YouTube to load playlists.</span>
        </div>
      </div>
    </section>

    <section class="wlh-card">
      <div class="wlh-card-text">
        <h2>Video action</h2>
        <p>Show quick Watch later actions beside video menus.</p>
      </div>
      <div class="wlh-control">
        <input type="checkbox" id="showCardButton" aria-label="Show quick Watch later actions beside video menus" />
      </div>
    </section>
  </main>

  <footer class="wlh-foot">
    <button id="resetBtn" type="button" title="Reset to defaults">Reset</button>
    <span id="savedNote" class="wlh-saved-note" aria-live="polite"></span>
  </footer>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
